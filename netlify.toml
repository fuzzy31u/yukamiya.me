[build]
  publish = "public"
  command = "npm run build"
  
[build.environment]
  NODE_VERSION = "14.15.0"
  
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[plugins]]
  package = "@netlify/plugin-gatsby"

# Review Astro in PR deploys without switching the production application.
[context.deploy-preview]
  base = "v2"
  publish = "dist"
  command = "npm run validate"

[context.deploy-preview.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"
  PUBLIC_RELEASE = "preview"
  # The UI-installed Gatsby plugin runs in every context; skip only Astro previews.
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"
